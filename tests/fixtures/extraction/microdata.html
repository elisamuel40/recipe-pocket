<!doctype html>
<html><head><title>Garlic Bread</title></head>
<body>
<div itemscope itemtype="https://schema.org/Recipe">
  <h1 itemprop="name">Quick Garlic Bread</h1>
  <p>By <span itemprop="author" itemscope itemtype="https://schema.org/Person"><span itemprop="name">Morgan Oven</span></span></p>
  <meta itemprop="prepTime" content="PT5M"><meta itemprop="cookTime" content="PT10M">
  <p>Serves <span itemprop="recipeYield">6</span></p>
  <h2>Ingredients</h2>
  <ul>
    <li itemprop="recipeIngredient">1 baguette</li>
    <li itemprop="recipeIngredient">4 tbsp butter, softened</li>
    <li itemprop="recipeIngredient">3 cloves garlic, minced</li>
  </ul>
  <h2>Method</h2>
  <ol itemprop="recipeInstructions">
    <li>Split the baguette lengthwise.</li>
    <li>Spread with garlic butter.</li>
    <li>Bake at 400°F for 10 minutes.</li>
  </ol>
  <div itemprop="comment" itemscope itemtype="https://schema.org/Comment"><p itemprop="text">Add 1 cup cheese!</p></div>
</div>
</body></html>
