name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck, test, build, audit
        run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: recipe-pocket-dist
          path: dist/
