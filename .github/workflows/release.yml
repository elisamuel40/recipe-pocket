name: Release
# Push a tag such as v0.1.1 to build, verify and publish the extension ZIP.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "$GITHUB_REF_NAME"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Typecheck, test, build, audit, package
        run: npm run package
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The unversioned copy keeps the releases/latest/download link stable.
          cp "release/recipe-pocket-$VERSION.zip" release/recipe-pocket.zip
          gh release create "$GITHUB_REF_NAME" \
            --title "Recipe Pocket $VERSION (developer build)" \
            --notes-file .github/release-notes.md \
            --latest \
            release/recipe-pocket.zip \
            "release/recipe-pocket-$VERSION.zip" \
            "release/recipe-pocket-$VERSION.zip.sha256"
